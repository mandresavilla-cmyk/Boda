<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitación de boda · Sofía y Mario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root {
  --terra: #9a3a12;
  --terra-deep: #6f270a;
  --paper: #eadfca;
  --paper-deep: #d6c6a8;
  --letter: #fbf8f1;
  --ink: #3a2616;
  --olive: #5b5d24;
  --olive-deep: #3f4118;
  --script: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --terra: #8a3310; --terra-deep: #5e2108; }
}
:root[data-theme="dark"] { --terra: #8a3310; --terra-deep: #5e2108; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  background: radial-gradient(120% 90% at 50% 35%, var(--terra) 0%, var(--terra-deep) 100%);
  background-color: var(--terra-deep);
  color: var(--ink);
  font-family: var(--serif);
  overflow-x: hidden;
}

/* ---------- Vista del sobre ---------- */
.stage {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 16px;
}
.env {
  --w: min(86vw, 440px);
  --h: calc(var(--w) * 0.68);
  position: relative;
  width: var(--w); height: var(--h);
  margin-top: calc(var(--h) * 0.62);
  perspective: 1400px;
  filter: drop-shadow(0 18px 28px rgba(40, 12, 2, .45));
}
.back { position: absolute; inset: 0; background: var(--paper-deep); border-radius: 3px; }
.letter {
  position: absolute; left: 6%; right: 6%; bottom: 5%; height: 92%;
  background: var(--letter);
  z-index: 2;
  text-align: center;
  padding: 7% 6% 0;
  transition: transform 1.1s cubic-bezier(.25,.7,.2,1) .6s;
  box-shadow: inset 0 0 0 1px rgba(90, 60, 30, .12);
}
.env.open .letter { transform: translateY(-58%); }
.letter .l1 { font-size: clamp(14px, 3.6vw, 17px); font-style: italic; color: var(--ink); opacity: .8; margin: 0; }
.letter .l2 { font-family: var(--script); font-size: clamp(34px, 9.5vw, 52px); line-height: 1.1; margin: .1em 0 .15em; color: var(--ink); }
.letter .l3 { font-size: clamp(14px, 3.6vw, 17px); margin: 0; color: var(--ink); opacity: .85; }

.front {
  position: absolute; inset: 0; z-index: 3;
  clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
  background: linear-gradient(165deg, #efe5d1 0%, var(--paper) 55%, #ddceb2 100%);
}
.flap {
  position: absolute; left: 0; top: 0; width: 100%; height: 58%;
  z-index: 4;
  transform-origin: 50% 0;
  transition: transform .9s ease-in-out .15s;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  background: linear-gradient(180deg, #e4d7bc 0%, #d9caab 100%);
}
.env.open .flap { transform: rotateX(180deg); }
.flap.behind { z-index: 1; background: linear-gradient(0deg, #cdbd9d 0%, #d6c7a8 100%); }

.to {
  position: absolute; left: 8%; right: 8%; top: 68%; bottom: 3%;
  z-index: 5; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
}
.to small { font-style: italic; font-size: clamp(13px, 3.4vw, 16px); opacity: .75; line-height: 1; }
.to .name {
  font-family: var(--script); line-height: 1.15; font-size: clamp(30px, 9vw, 46px);
  white-space: nowrap; max-width: 100%;
}

.seal {
  position: absolute; left: 50%; top: 58%; z-index: 6;
  width: clamp(54px, 15vw, 72px); aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border: 0; padding: 0; cursor: pointer; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #7a7c34 0%, var(--olive) 45%, var(--olive-deep) 100%);
  box-shadow: 0 3px 8px rgba(0,0,0,.4), inset 0 0 0 3px rgba(255,255,255,.07), inset 0 0 0 6px rgba(0,0,0,.12);
  transition: transform .5s ease, opacity .5s ease;
  animation: latido 2.8s ease-in-out infinite;
}
.seal svg { width: 62%; height: 62%; position: absolute; inset: 19%; }
.seal:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
.seal.gone { transform: translate(-50%, -50%) scale(1.5); opacity: 0; pointer-events: none; animation: none; }
@keyframes latido { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.07); } }

.hint, .cta { margin-top: 28px; text-align: center; color: #f5e9d6; min-height: 70px; }
.hint { font-style: italic; font-size: 18px; letter-spacing: .02em; transition: opacity .4s; }
.hint.hide { opacity: 0; }
.cta { opacity: 0; transition: opacity .8s ease; position: absolute; }
.cta.show { opacity: 1; }
.cta a {
  display: inline-block; padding: 12px 28px; border-radius: 999px;
  background: var(--letter); color: var(--ink); text-decoration: none;
  font-weight: 600; font-size: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.3);
}
.cta a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.cta p { margin: 10px 0 0; font-size: 15px; font-style: italic; opacity: .85; }
.cta-wrap { position: relative; width: 100%; display: flex; justify-content: center; }

/* ---------- Generador ---------- */
.gen { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; color: #f5e9d6; }
.gen h1 { font-family: var(--script); font-weight: 400; font-size: 44px; margin: 0 0 4px; }
.gen p { margin: 0 0 16px; font-size: 18px; line-height: 1.4; }
.gen textarea {
  width: 100%; min-height: 150px; padding: 12px; border-radius: 8px; border: 0;
  background: var(--letter); color: var(--ink); font: 18px/1.4 var(--serif);
}
.gen button, .gen .btn {
  font: 600 16px var(--serif); padding: 10px 16px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--paper); color: var(--ink); text-decoration: none; display: inline-block;
}
.gen button:focus-visible, .gen .btn:focus-visible, .gen textarea:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.gen .primary { background: var(--olive); color: #fff; margin-top: 12px; }
.rows { margin-top: 20px; display: grid; gap: 8px; }
.row {
  background: rgba(251, 248, 241, .96); color: var(--ink); border-radius: 8px;
  padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
}
.row .n { font-size: 19px; font-weight: 600; flex: 1 1 160px; overflow-wrap: anywhere; }
.row .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.row .acts button, .row .acts .btn { padding: 6px 12px; font-size: 15px; background: var(--paper-deep); }
.bulk { margin-top: 18px; display: none; }
.bulk textarea { min-height: 110px; font-size: 14px; }
.gen .note { font-size: 15px; font-style: italic; opacity: .85; margin-top: 18px; }

@media (prefers-reduced-motion: reduce) {
  .seal { animation: none; }
  .letter, .flap, .seal, .cta, .hint { transition-duration: .01s !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  var INVITACION = "https://boda-mario-sofia.my.canva.site/boda-de-sofia-y-mario";
  var app = document.getElementById("app");
  var params = new URLSearchParams(location.search);
  var invitado = (params.get("invitado") || "").trim();

  function baseLink() { return location.origin + location.pathname; }
  function linkPara(nombre) { return baseLink() + "?invitado=" + encodeURIComponent(nombre); }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  /* ---------- Vista del sobre ---------- */
  function mostrarSobre(nombre) {
    document.title = "Invitación para " + nombre;
    app.innerHTML =
      '<main class="stage">' +
        '<div class="env" id="env">' +
          '<div class="back"></div>' +
          '<div class="letter" aria-hidden="true">' +
            '<p class="l1">Con alegría te invitamos a la boda de</p>' +
            '<p class="l2">Sofía y Mario</p>' +
            '<p class="l3">Queremos celebrarlo contigo</p>' +
          '</div>' +
          '<div class="front"></div>' +
          '<div class="flap" id="flap"></div>' +
          '<div class="to"><small>Para</small><span class="name" id="nombre">' + esc(nombre) + '</span></div>' +
          '<button class="seal" id="sello" aria-label="Abrir el sobre">' +
            '<svg viewBox="0 0 40 40" fill="none" stroke="rgba(235,230,190,.75)" stroke-width="1.6" stroke-linecap="round">' +
              '<path d="M20 35V10"/><path d="M20 14c-4-1-5-4-5-7 3 0 5 3 5 7z"/><path d="M20 14c4-1 5-4 5-7-3 0-5 3-5 7z"/>' +
              '<path d="M20 22c-4-1-6-4-6-7 3 0 6 3 6 7z"/><path d="M20 22c4-1 6-4 6-7-3 0-6 3-6 7z"/>' +
              '<path d="M20 30c-4-1-6-4-6-7 3 0 6 3 6 7z"/><path d="M20 30c4-1 6-4 6-7-3 0-6 3-6 7z"/>' +
            '</svg>' +
          '</button>' +
        '</div>' +
        '<div class="cta-wrap">' +
          '<div class="hint" id="hint">Toca el sello para abrir</div>' +
          '<div class="cta" id="cta"><a href="' + INVITACION + '">Ver la invitación</a><p>Abriendo tu invitación…</p></div>' +
        '</div>' +
      '</main>';

    // Ajusta el nombre si es largo
    var n = document.getElementById("nombre");
    var box = n.parentElement;
    var fs = parseFloat(getComputedStyle(n).fontSize);
    while (n.scrollWidth > box.clientWidth && fs > 16) { fs -= 1; n.style.fontSize = fs + "px"; }

    var env = document.getElementById("env"), flap = document.getElementById("flap");
    var sello = document.getElementById("sello"), hint = document.getElementById("hint"), cta = document.getElementById("cta");
    var abierto = false;
    sello.addEventListener("click", function () {
      if (abierto) return; abierto = true;
      env.classList.add("open"); sello.classList.add("gone"); hint.classList.add("hide");
      setTimeout(function () { flap.classList.add("behind"); }, 500);
      setTimeout(function () { cta.classList.add("show"); }, 1900);
      setTimeout(function () { try { window.location.assign(INVITACION); } catch (e) {} }, 3800);
    });
  }

  /* ---------- Generador de enlaces ---------- */
  function copiar(texto, boton) {
    function ok() { var t = boton.textContent; boton.textContent = "Copiado"; setTimeout(function () { boton.textContent = t; }, 1200); }
    function respaldo() {
      var ta = document.createElement("textarea"); ta.value = texto; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); ok(); } catch (e) { boton.textContent = "Copia manual"; }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, respaldo);
    else respaldo();
  }

  function mostrarGenerador() {
    document.title = "Generador de enlaces · Sofía y Mario";
    app.innerHTML =
      '<main class="gen">' +
        '<h1>Enlaces por invitado</h1>' +
        '<p>Escribe un nombre por línea (por ejemplo: Mariana y familia). Cada invitado recibirá un sobre con su nombre.</p>' +
        '<textarea id="nombres" placeholder="Mariana y familia&#10;Carlos y Ana&#10;Tía Luz"></textarea>' +
        '<button class="primary" id="generar">Generar enlaces</button>' +
        '<div class="rows" id="filas"></div>' +
        '<div class="bulk" id="bulk">' +
          '<button id="copiarTodo">Copiar todos (nombre y enlace)</button>' +
          '<textarea id="tsv" readonly aria-label="Lista completa de nombres y enlaces"></textarea>' +
        '</div>' +
        '<p class="note">Esta pantalla solo la ves tú. Los invitados abren únicamente su enlace con el sobre.</p>' +
      '</main>';

    document.getElementById("generar").addEventListener("click", function () {
      var lista = document.getElementById("nombres").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      var filas = document.getElementById("filas"); filas.innerHTML = "";
      var tsv = [];
      lista.forEach(function (nombre) {
        var link = linkPara(nombre);
        tsv.push(nombre + "\t" + link);
        var r = document.createElement("div"); r.className = "row";
        var msg = nombre + ", tienes una invitación especial de Sofía y Mario 💌\n" + link;
        r.innerHTML = '<span class="n">' + esc(nombre) + '</span><span class="acts">' +
          '<a class="btn" target="_blank" rel="noopener" href="' + link + '">Probar</a>' +
          '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(msg) + '">WhatsApp</a>' +
          '<button type="button">Copiar enlace</button></span>';
        r.querySelector("button").addEventListener("click", function (e) { copiar(link, e.currentTarget); });
        filas.appendChild(r);
      });
      var bulk = document.getElementById("bulk");
      bulk.style.display = lista.length ? "block" : "none";
      document.getElementById("tsv").value = tsv.join("\n");
      document.getElementById("copiarTodo").onclick = function (e) { copiar(tsv.join("\n"), e.currentTarget); };
    });
  }

  if (invitado) mostrarSobre(invitado); else mostrarGenerador();
})();
</script>
</body>
</html>
